<script>
document.addEventListener('DOMContentLoaded',function(){
'use strict';
var SUPABASE_URL='https://kidqauasemiacoytrimb.supabase.co';
var SUPABASE_KEY='sb_publishable_pCOzY05tLqimItCA5nMbNA_2zG2lhaS';
var cloud = window.supabase.createClient('https://kidqauasemiacoytrimb.supabase.co',
'sb_publishable_pCOzY05tLqimItCA5nMbNA_2zG2lhaS'
);var CLOUD_READY=!!cloud;
var STORAGE_KEY='nailu-final-collections-meta-v2';

var DB_NAME='nailu-image-db-v1';
var STORE='images';
var db=null;
var sortableInstance=null;
var activeDragPreview=null;
var activeDragCard=null;
var state={editingDesignId:null,activeBoard:'All',designs:[],pendingFiles:[],pendingSelected:false,isSorting:false,isReordering:false,draggingId:null,dragStartX:0,dragStartY:0,dragIntent:null};
var els={sidebar:gid('sidebar'),sidebarToggle:gid('sidebarToggle'),homeButton:gid('homeButton'),openModalButton:gid('openModalButton'),closeModalButton:gid('closeModalButton'),modalOverlay:gid('modalOverlay'),modalTitle:gid('modalTitle'),selectedToggle:gid('selectedToggle'),imageUpload:gid('imageUpload'),uploadDropzone:gid('uploadDropzone'),storageWarning:gid('storageWarning'),inboxDropZone:gid('inboxDropZone'),gallery:gid('gallery'),heroTitle:gid('heroTitle'),heroCount:gid('heroCount'),trashZone:gid('trashZone'),saveDesignButton:gid('saveDesignButton'),exportButton:gid('exportButton'),designName:gid('designName'),designSKU:gid('designSKU'),designCategory:gid('designCategory'),navItems:[].slice.call(document.querySelectorAll('.nav-item')),categoryTargets:[].slice.call(document.querySelectorAll('.category-drop-target'))};
function gid(id){return document.getElementById(id)}

function norm(v){return String(v||'').trim().toLowerCase().replace('ombre','ombré').replace('cateye','cat eye')}
function openDB(){return new Promise(function(resolve,reject){var request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=function(){if(!request.result.objectStoreNames.contains(STORE)){request.result.createObjectStore(STORE)}};request.onsuccess=function(){db=request.result;resolve(db)};request.onerror=function(){reject(request.error)}})}
function dbPut(key,value){return new Promise(function(resolve,reject){var tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,key);tx.oncomplete=function(){resolve()};tx.onerror=function(){reject(tx.error)}})}
function dbGet(key){return new Promise(function(resolve,reject){var request=db.transaction(STORE,'readonly').objectStore(STORE).get(key);request.onsuccess=function(){resolve(request.result)};request.onerror=function(){reject(request.error)}})}
function dbDel(key){return new Promise(function(resolve,reject){var tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key);tx.oncomplete=function(){resolve()};tx.onerror=function(){reject(tx.error)}})}
function fileToURL(file){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(event){resolve(event.target.result)};reader.onerror=function(){reject(reader.error)};reader.readAsDataURL(file)})}
function cloudRowToDesign(row){return {id:String(row.id),name:row.name||'',category:row.category||'Inbox',colour:row.colour||'',sku:row.sku||'',selected:!!row.selected,pending:(row.category||'Inbox')==='Inbox',image_url:row.image_url||'',fileName:''}}
async function loadCloudDesigns(){if(!CLOUD_READY)return null;var result=await cloud.from('Book Designs').select('*').order('created_at',{ascending:false});if(result.error){console.error('Supabase load failed',result.error);return null}return (result.data||[]).map(cloudRowToDesign)}
async function uploadToSupabase(file){if(!CLOUD_READY)throw new Error('Supabase is not loaded');var ext=(file.name.split('.').pop()||'jpg').toLowerCase();var safeName=Date.now()+'-'+Math.random().toString(16).slice(2)+'.'+ext;var filePath='uploads/'+safeName;var uploaded=await cloud.storage.from('Book Designs').upload(filePath,file,{cacheControl:'3600',upsert:false});if(uploaded.error)throw uploaded.error;var publicData=cloud.storage.from('Book Designs').getPublicUrl(filePath);return publicData.data.publicUrl}

function loadMeta(){try{var primary=localStorage.getItem(STORAGE_KEY);if(primary){var parsed=JSON.parse(primary);if(Array.isArray(parsed))return parsed}var legacy=localStorage.getItem(OLD_KEY);if(legacy){var oldParsed=JSON.parse(legacy);if(Array.isArray(oldParsed))return oldParsed}return []}catch(error){console.warn('Could not load designs',error);return[]}}
function metaCopy(design){var copy=Object.assign({},design);delete copy.image;return copy}

function showWarn(){if(els.storageWarning)els.storageWarning.style.display='block'}
function hideWarn(){if(els.storageWarning)els.storageWarning.style.display='none'}
function onlyImages(list){return [].slice.call(list||[]).filter(function(file){return file&&file.type&&file.type.indexOf('image/')===0})}
function dup(file){var name=String(file.name||'').trim().toLowerCase();return state.designs.some(function(design){return String(design.fileName||'').trim().toLowerCase()===name})}
function uniqueFiles(list){return onlyImages(list).filter(function(file){return !dup(file)})}
function filtered(){if(state.activeBoard==='All')return state.designs.filter(function(d){return d.pending||d.category==='Inbox'});if(state.activeBoard==='All Designs')return state.designs;if(state.activeBoard==='Favourites')return state.designs.filter(function(d){return d.selected});return state.designs.filter(function(d){var board=norm(state.activeBoard);return norm(d.category)===board||norm(d.colour)===board})}

async function renderGallery(){var list=filtered();els.heroTitle.textContent=state.activeBoard==='All'?'Inbox':state.activeBoard;els.heroCount.textContent=String(list.length).padStart(2,'0');if(!list.length){els.gallery.innerHTML='<div class="empty" id="emptyStateUpload"><div class="empty-plus"></div></div>';var emptyTrigger=document.getElementById('emptyStateUpload');if(emptyTrigger){on(emptyTrigger,'click',function(){els.imageUpload.click()})}refreshSorting();return}els.gallery.innerHTML=list.map(function(d){var badge=(state.activeBoard==='Favourites'&&!d.pending&&d.category)?'<div class="card-badge">'+esc(d.category)+'</div>':(d.pending?'<div class="card-badge">Inbox</div>':'');return '<article class="card" data-id="'+esc(d.id)+'"><button class="card-handle" data-handle="'+esc(d.id)+'" type="button">⠿</button><button class="card-favourite '+(d.selected?'active':'')+'" data-favourite="'+esc(d.id)+'" type="button" aria-label="Favourite"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35L10.55 20.03C5.4 15.36 2 12.28 2 8.5C2 5.42 4.42 3 7.5 3C9.24 3 10.91 3.81 12 5.09C13.09 3.81 14.76 3 16.5 3C19.58 3 22 5.42 22 8.5C22 12.28 18.6 15.36 13.45 20.03L12 21.35Z"/></svg></button><button class="card-edit" data-edit="'+esc(d.id)+'" type="button" aria-label="Edit"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 20H8L18.5 9.5C19.3284 8.67157 19.3284 7.32843 18.5 6.5C17.6716 5.67157 16.3284 5.67157 15.5 6.5L5 17V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg></button><img data-img="'+esc(d.id)+'" alt="'+esc(d.name||'NAILU inspiration image')+'">'+badge+'</article>'}).join('');list.forEach(async function(d){var img=els.gallery.querySelector('img[data-img="'+CSS.escape(d.id)+'"]');if(img)img.src=await getImage(d)});bindCards();refreshSorting()}
function bindCards(){els.gallery.querySelectorAll('.card-handle').forEach(function(button){on(button,'mousedown',function(event){event.stopPropagation();state.dragIntent='reorder'})});els.gallery.querySelectorAll('.card-favourite').forEach(function(button){on(button,'click',async function(event){event.preventDefault();event.stopPropagation();var favId=button.getAttribute('data-favourite');var design=state.designs.find(function(d){return String(d.id)===String(favId)});if(!design)return;design.selected=!design.selected;button.classList.toggle('active',design.selected);if(CLOUD_READY){var updated=await cloud.from('Book Designs').update({selected:design.selected}).eq('id',design.id);if(updated.error)console.error('Supabase favourite update failed',updated.error)}saveStorage()})});els.gallery.querySelectorAll('.card-edit').forEach(function(button){on(button,'click',function(event){event.preventDefault();event.stopPropagation();var editId=button.getAttribute('data-edit');var design=state.designs.find(function(d){return d.id===editId});if(!design)return;resetModal();openEdit(design)})});els.gallery.querySelectorAll('.card').forEach(function(card){on(card,'pointerdown',function(event){if(event.target.closest('.card-handle')||event.target.closest('.card-favourite')||event.target.closest('.card-edit'))return;state.dragIntent='categorise';state.dragStartX=event.clientX;state.dragStartY=event.clientY});on(card,'click',function(){})})}
async function removeDesign(idValue){if(CLOUD_READY){var deleted=await cloud.from('Book Designs').delete().eq('id',idValue);if(deleted.error)console.error('Supabase delete failed',deleted.error)}var design=state.designs.find(function(d){return String(d.id)===String(idValue)});if(design&&design.imageKey)await dbDel(design.imageKey);state.designs=state.designs.filter(function(d){return String(d.id)!==String(idValue)});saveStorage();renderGallery()}
function resetModal(){state.pendingFiles=[];state.pendingSelected=false;els.selectedToggle.textContent='♡';els.selectedToggle.style.opacity='.45';els.uploadDropzone.textContent='Click or drag & drop files here';els.imageUpload.value='';els.designName.value='';els.designSKU.value='';els.designCategory.value='White';els.modalTitle.textContent='Add Design'}
function openBase(){els.modalOverlay.classList.add('open')}
function openNew(){state.editingDesignId=null;resetModal();openBase()}
function openEdit(design){state.editingDesignId=design.id;els.modalTitle.textContent='Edit Design';els.designName.value=design.name||'';els.designSKU.value=design.sku||'';els.designCategory.value=design.category&&design.category!=='Inbox'?design.category:'White';state.pendingSelected=!!design.selected;els.selectedToggle.textContent=state.pendingSelected?'♥':'♡';els.selectedToggle.style.opacity=state.pendingSelected?'1':'.45';els.uploadDropzone.textContent='Editing existing image';openBase()}
function closeModal(){state.editingDesignId=null;els.modalOverlay.classList.remove('open')}
function updatePending(files){state.pendingFiles=uniqueFiles(files);els.uploadDropzone.textContent=state.pendingFiles.length?String(state.pendingFiles.length)+' file(s) selected':'Click or drag & drop files here'}
async function addFiles(files){var fs=uniqueFiles(files);if(!fs.length)return;var categories=['White','Pink','Red','Ombré','French Tip','Other'];var directCategory=categories.indexOf(state.activeBoard)>-1?state.activeBoard:null;var newDesigns=[];for(var i=0;i<fs.length;i++){var file=fs[i];try{var imageUrl=await uploadToSupabase(file);var category=directCategory||'Inbox';var inserted=await cloud.from('Book Designs').insert([{name:'',category:category,colour:directCategory||'',sku:'',selected:false,image_url:imageUrl,sort_order:0}]).select('*').single();if(inserted.error)throw inserted.error;var design=cloudRowToDesign(inserted.data);design.fileName=file.name;newDesigns.push(design)}catch(error){console.error('Upload failed',error);alert('Upload failed. Check Supabase storage policies and try again.')}}state.designs=newDesigns.reverse().concat(state.designs);saveStorage();renderGallery()}
async function saveDesign(){var name=els.designName.value.trim()||'Untitled';var category=els.designCategory.value;var sku=els.designSKU.value.trim();if(state.editingDesignId){var existing=state.designs.find(function(d){return d.id===state.editingDesignId});if(!existing)return;Object.assign(existing,{name:name,category:category,colour:category,sku:sku,selected:state.pendingSelected,pending:false});if(CLOUD_READY){var updated=await cloud.from('Book Designs').update({name:name,category:category,colour:category,sku:sku,selected:state.pendingSelected}).eq('id',existing.id);if(updated.error)console.error('Supabase update failed',updated.error)}saveStorage();closeModal();resetModal();renderGallery();return}if(!state.pendingFiles.length){alert('Please upload at least one image.');return}var newDesigns=[];for(var i=0;i<state.pendingFiles.length;i++){var file=state.pendingFiles[i];try{var imageUrl=await uploadToSupabase(file);var inserted=await cloud.from('Book Designs').insert([{name:name,category:category,colour:category,sku:sku,selected:state.pendingSelected,image_url:imageUrl,sort_order:0}]).select('*').single();if(inserted.error)throw inserted.error;var design=cloudRowToDesign(inserted.data);design.fileName=file.name;newDesigns.push(design)}catch(error){console.error('Upload failed',error);alert('Upload failed. Check Supabase storage policies and try again.')}}state.designs=newDesigns.reverse().concat(state.designs);saveStorage();closeModal();resetModal();renderGallery()}
function clearCategoryHover(){els.categoryTargets.forEach(function(t){t.classList.remove('drag-hover')})}
function targetFromPoint(x,y){var el=document.elementFromPoint(x,y);return el?el.closest('.category-drop-target'):null}
function trashFromPoint(x,y){var el=document.elementFromPoint(x,y);return el?el.closest('#trashZone'):null}
async function categoriseDesign(idValue,category){var design=state.designs.find(function(d){return String(d.id)===String(idValue)});if(!design)return;design.category=category;design.colour=category;design.pending=false;if(CLOUD_READY){var updated=await cloud.from('Book Designs').update({category:category,colour:category}).eq('id',design.id);if(updated.error)console.error('Supabase category update failed',updated.error)}saveStorage();renderGallery()}
function updateCategoryHoverFromPoint(x,y){if(!state.isSorting)return;clearCategoryHover();var target=targetFromPoint(x,y);if(target)target.classList.add('drag-hover')}
function createDragPreview(card,x,y){destroyDragPreview();activeDragCard=card;activeDragPreview=card.cloneNode(true);activeDragPreview.classList.add('drag-preview');activeDragPreview.classList.remove('card','dragging-placeholder','native-drag-hidden');activeDragPreview.style.left='0px';activeDragPreview.style.top='0px';document.body.appendChild(activeDragPreview);card.classList.add('dragging-placeholder');moveDragPreview(x,y)}
function moveDragPreview(x,y){if(!activeDragPreview)return;activeDragPreview.style.left=(x-22)+'px';activeDragPreview.style.top=(y-22)+'px'}
function destroyDragPreview(){if(activeDragPreview&&activeDragPreview.parentNode)activeDragPreview.parentNode.removeChild(activeDragPreview);activeDragPreview=null;if(activeDragCard)activeDragCard.classList.remove('dragging-placeholder');activeDragCard=null}
function bindCategoryDropTargets(){els.categoryTargets.forEach(function(target){on(target,'dragover',function(event){if(!state.isSorting)return;event.preventDefault();clearCategoryHover();target.classList.add('drag-hover')});on(target,'dragenter',function(event){if(!state.isSorting)return;event.preventDefault();clearCategoryHover();target.classList.add('drag-hover')});on(target,'dragleave',function(){target.classList.remove('drag-hover')});on(target,'drop',function(event){if(!state.isSorting||!state.draggingId)return;event.preventDefault();event.stopPropagation();categoriseDesign(state.draggingId,target.dataset.categoryTarget);state.isSorting=false;state.draggingId=null;destroyDragPreview();clearCategoryHover()})})}
function bindEvents(){on(els.sidebarToggle,'click',function(){els.sidebar.classList.toggle('closed');var closed=els.sidebar.classList.contains('closed');els.sidebar.style.transform=closed?'translateX(-100%)':'translateX(0)';var main=document.querySelector('main');main.style.marginLeft=closed?'0':'260px';main.style.width=closed?'100%':'calc(100% - 260px)';els.sidebarToggle.classList.toggle('is-close',!closed);els.sidebarToggle.setAttribute('aria-label',closed?'Open menu':'Close menu')});on(els.homeButton,'click',function(){setBoard('All')});on(els.openModalButton,'click',openNew);on(els.exportButton,'click',exportCollections);on(els.closeModalButton,'click',closeModal);on(els.selectedToggle,'click',function(event){event.preventDefault();state.pendingSelected=!state.pendingSelected;els.selectedToggle.textContent=state.pendingSelected?'♥':'♡';els.selectedToggle.style.opacity=state.pendingSelected?'1':'.45'});on(els.saveDesignButton,'click',saveDesign);on(els.modalOverlay,'click',function(event){if(event.target===els.modalOverlay)closeModal()});on(els.imageUpload,'change',function(event){updatePending(event.target.files)});on(els.uploadDropzone,'click',function(){if(!state.editingDesignId)els.imageUpload.click()});['dragover','dragenter'].forEach(function(type){on(els.uploadDropzone,type,function(event){event.preventDefault();event.stopPropagation();if(!state.editingDesignId)els.uploadDropzone.classList.add('drag-active')});on(els.inboxDropZone,type,function(event){event.preventDefault();els.inboxDropZone.classList.add('drag-active')})});['dragleave','drop'].forEach(function(type){on(els.uploadDropzone,type,function(event){event.preventDefault();event.stopPropagation();els.uploadDropzone.classList.remove('drag-active')});on(els.inboxDropZone,type,function(event){event.preventDefault();els.inboxDropZone.classList.remove('drag-active')})});on(els.uploadDropzone,'drop',function(event){if(!state.editingDesignId)updatePending(event.dataTransfer.files)});on(els.inboxDropZone,'drop',function(event){addFiles(event.dataTransfer.files)});els.navItems.forEach(function(item){on(item,'click',function(){if(!state.isSorting)setBoard(item.dataset.board)})});bindCategoryDropTargets();on(document,'dragover',function(event){if(state.isSorting){event.preventDefault();moveDragPreview(event.clientX,event.clientY);updateCategoryHoverFromPoint(event.clientX,event.clientY)}});on(document,'mousemove',function(event){if(state.dragIntent==='categorise'&&!state.isSorting){var dx=Math.abs(event.clientX-state.dragStartX);var dy=Math.abs(event.clientY-state.dragStartY);if(dx>6||dy>6){var card=document.elementFromPoint(state.dragStartX,state.dragStartY);card=card?card.closest('.card'):null;if(card){state.isSorting=true;state.dragIntent='categorise-dragging';state.draggingId=card.getAttribute('data-id');card.classList.add('drag-categorising');createDragPreview(card,event.clientX,event.clientY)}}}if(state.isSorting){moveDragPreview(event.clientX,event.clientY);updateCategoryHoverFromPoint(event.clientX,event.clientY);var trashTarget=trashFromPoint(event.clientX,event.clientY);if(trashTarget){els.trashZone.classList.add('drag-active')}else{els.trashZone.classList.remove('drag-active')}}});on(document,'mouseup',async function(event){if(state.dragIntent==='categorise-dragging'&&state.draggingId){var target=targetFromPoint(event.clientX,event.clientY);var trashTarget=trashFromPoint(event.clientX,event.clientY);if(trashTarget){await removeDesign(state.draggingId)}else if(target){categoriseDesign(state.draggingId,target.dataset.categoryTarget)}destroyDragPreview();clearCategoryHover();els.trashZone.classList.remove('drag-active');document.querySelectorAll('.card.drag-categorising').forEach(function(card){card.classList.remove('drag-categorising')});state.draggingId=null;state.isSorting=false}state.dragIntent=null});on(document,'drop',function(){destroyDragPreview();clearCategoryHover();els.trashZone.classList.remove('drag-active');state.draggingId=null;state.isSorting=false;state.dragIntent=null})}
function refreshSorting(){if(sortableInstance){sortableInstance.destroy();sortableInstance=null}if(typeof Sortable==='undefined')return;sortableInstance=Sortable.create(els.gallery,{animation:180,forceFallback:true,fallbackOnBody:true,fallbackTolerance:3,fallbackClass:'native-drag-hidden',ghostClass:'drag-ghost',chosenClass:'dragging-placeholder',dragClass:'native-drag-hidden',filter:'.empty',preventOnFilter:false,handle:'.card-handle',onStart:function(event){state.isSorting=true;state.isReordering=true;state.draggingId=event&&event.item?event.item.getAttribute('data-id'):null;document.body.style.cursor='grabbing';var original=event.originalEvent;if(event&&event.item)createDragPreview(event.item,original?original.clientX:0,original?original.clientY:0)},onMove:function(event){var original=event.originalEvent;if(original){moveDragPreview(original.clientX,original.clientY);updateCategoryHoverFromPoint(original.clientX,original.clientY)}return true},onEnd:async function(event){document.body.style.cursor='';destroyDragPreview();state.isReordering=false;var original=event.originalEvent;var rect=els.trashZone.getBoundingClientRect();var droppedInTrash=original&&original.clientX>=rect.left&&original.clientX<=rect.right&&original.clientY>=rect.top&&original.clientY<=rect.bottom;var target=original?targetFromPoint(original.clientX,original.clientY):null;clearCategoryHover();if(droppedInTrash){await removeDesign(event.item.getAttribute('data-id'));state.isSorting=false;state.draggingId=null;return}if(target){categoriseDesign(event.item.getAttribute('data-id'),target.dataset.categoryTarget);state.isSorting=false;state.draggingId=null;return}var ids=[].slice.call(els.gallery.querySelectorAll('.card')).map(function(card){return card.dataset.id});state.designs.sort(function(a,b){var ai=ids.indexOf(a.id);var bi=ids.indexOf(b.id);if(ai<0&&bi<0)return 0;if(ai<0)return 1;if(bi<0)return-1;return ai-bi});if(CLOUD_READY){state.designs.forEach(function(d,index){cloud.from('Book Designs').update({sort_order:index}).eq('id',d.id).then(function(result){if(result.error)console.error('Supabase order update failed',result.error)})})}saveStorage();setTimeout(function(){state.isSorting=false;state.draggingId=null},80)}})}
async function exportCollections(){
try{
els.exportButton.style.opacity='.42';
var enriched=[];
for(var i=0;i<state.designs.length;i++){
var design=Object.assign({},state.designs[i]);
design.image=await getImage(design);
enriched.push(design);
}
var exportData=JSON.stringify(enriched).replace(/</g,'\\u003c');
var source=document.documentElement.outerHTML;
source=source.replace('</body>','<script>window.__NAILU_EXPORT__ = '+exportData+';<\/script></body>');
var blob=new Blob([source],{type:'text/html;charset=utf-8'});
var url=URL.createObjectURL(blob);
var link=document.createElement('a');
link.href=url;
link.download='NAILU_COLLECTIONS.html';
link.style.display='none';
document.body.appendChild(link);
requestAnimationFrame(function(){link.click();});
setTimeout(function(){
URL.revokeObjectURL(url);
link.remove();
els.exportButton.style.opacity='.82';
},1200);
}catch(error){
console.error(error);
alert('Export failed');
els.exportButton.style.opacity='.82';
}
}

function tests(){console.group('NAILU self-tests');console.assert(!!indexedDB,'IndexedDB exists');console.assert(typeof openDB==='function','openDB exists');console.assert(typeof renderGallery==='function','renderGallery exists');console.assert(typeof addFiles==='function','addFiles exists');console.assert(typeof saveDesign==='function','saveDesign exists');console.assert(typeof createDragPreview==='function','drag preview exists');console.assert(CLOUD_READY,'Supabase client loaded');console.assert(typeof exportCollections==='function','export exists');console.assert(exportCollections.toString().indexOf('NAILU_COLLECTIONS.html')>-1,'export configured');console.assert(norm('Ombre')==='ombré','Ombre normalises');console.groupEnd()}
(async function init(){try{await openDB();els.sidebarToggle.classList.add('is-close');var cloudDesigns=await loadCloudDesigns();if(cloudDesigns){state.designs=cloudDesigns}else if(window.__NAILU_EXPORT__&&Array.isArray(window.__NAILU_EXPORT__)){state.designs=window.__NAILU_EXPORT__.map(function(design){return Object.assign({},design)})}else{state.designs=loadMeta()}bindEvents();renderGallery();tests()}catch(error){console.error(error);alert('Storage could not initialise. Check Supabase settings or open this as a normal browser page.')}})();
});
